
{# Justificatifs facultatifs, envoyés après l'enregistrement de la note #}

<hr class="receipt-divider">

<div class="receipt-section">

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-1">
        <strong>📎 Justificatifs (facultatif)</strong>

        {% if item is defined and item.id %}
        <span class="text-muted small receipt-count"
              data-item-id="{{ item.id }}">
            {{ item.receipts|length }} justificatif(s) enregistré(s)
        </span>
        {% endif %}
    </div>

    <label class="form-label mt-1 mb-1">
        Ajouter un ou plusieurs fichiers
    </label>

    <input
        type="file"
        class="form-control receipt-files"
        accept=".pdf,.jpg,.jpeg,.png"
        multiple>

    <div class="form-text">
        PDF, JPG ou PNG — 10 Mo maximum par fichier.
        Champ facultatif.
    </div>

    <div class="small text-muted receipt-pending mt-1"></div>

</div>
