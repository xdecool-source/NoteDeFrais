{# Justificatifs facultatifs, envoyés après l'enregistrement de la note #}
<hr>
<div class="receipt-section">
    <strong>📎 Justificatifs (facultatif)</strong>
    {% if item is defined and item.id %}
    <div class="text-muted small receipt-count" data-item-id="{{ item.id }}">
        {{ item.receipts|length }} justificatif(s) déjà enregistré(s)
    </div>
    {% endif %}
    <label class="form-label mt-2">Ajouter un ou plusieurs fichiers</label>
    <input type="file"
           class="form-control receipt-files"
           accept=".pdf,.jpg,.jpeg,.png"
           multiple>
    <div class="form-text">PDF, JPG ou PNG — 10 Mo maximum par fichier. Vous pouvez laisser ce champ vide.</div>
    <div class="small text-muted receipt-pending mt-1"></div>
</div>
